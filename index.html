<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EscalaVale — Gestão de Escalas</title>
  <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#101a30" />
  <style id="print-orientacao">@page { size: landscape; margin: 4mm 5mm; }</style>
  <meta name="description" content="Sistema de gestão de escalas: médiuns, trabalhos, horários e disponibilidade." />
  <link rel="stylesheet" href="css/style.css?v=1.8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <img class="brand-mark" src="icons/icone-64.png" alt="" aria-hidden="true" width="40" height="40" />
        <div>
          <strong>EscalaVale</strong>
          <small>Gestão de escalas</small>
        </div>
      </div>
      <nav>
        <button class="nav-item is-active" data-route="dashboard" aria-current="page">
          <span aria-hidden="true">◧</span> Início
        </button>
        <button class="nav-item" data-route="mediuns">
          <span aria-hidden="true">○</span> Médiuns
        </button>
        <button class="nav-item" data-route="usuarios" id="nav-usuarios" style="display:none">
          <span aria-hidden="true">👥</span> Usuários
        </button>
        <div class="nav-group" id="nav-group-dirigentes">
          <button class="nav-item nav-group-toggle" data-group="dirigentes" aria-expanded="true">
            <span aria-hidden="true">◐</span> Escala de dirigentes
            <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div class="nav-sub" id="sub-dirigentes">
            <button class="nav-item sub" data-route="escala">Grade</button>
            <button class="nav-item sub" data-route="dir-trabalhos">Trabalhos</button>
            <button class="nav-item sub" data-route="dir-horarios">Horários</button>
            <button class="nav-item sub" data-route="dir-disponibilidade">Disponibilidade</button>
          </div>
        </div>
        <div class="nav-group" id="nav-group-ajanas">
          <button class="nav-item nav-group-toggle" data-group="ajanas" aria-expanded="true">
            <span aria-hidden="true">☾</span> Escala de Ajanãs
            <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div class="nav-sub" id="sub-ajanas">
            <button class="nav-item sub" data-route="aj-grade">Grade Templo</button>
            <button class="nav-item sub" data-route="aj-oraculo">Grade Oráculo</button>
            <button class="nav-item sub" data-route="aj-libertacao">Grade Libertação</button>
            <button class="nav-item sub" data-route="aj-sanday">Grade Sanday Tronos</button>
            <button class="nav-item sub" data-route="aj-sublimacao">Grade Sublimação e Turigano</button>
            <button class="nav-item sub" data-route="aj-trabalhos">Trabalhos</button>
            <button class="nav-item sub" data-route="aj-horarios">Horários</button>
            <button class="nav-item sub" data-route="aj-disponibilidade">Disponibilidade</button>
          </div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm" id="btn-exportar">Exportar dados</button>
        <button class="btn btn-ghost btn-sm" id="btn-importar">Importar</button>
        <input type="file" id="input-importar" accept="application/json" hidden />
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Abrir menu">☰</button>
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="busca-global" type="search" placeholder="Buscar médium, trabalho… ( / )" aria-label="Busca global" />
        </div>
        <div class="topbar-actions">
          <input type="date" id="atalho-data" aria-label="Ir para data da escala" title="Ir para data da escala" />
          <button class="btn btn-primary" id="btn-nova-escala">+ Nova escala</button>
        </div>
      </header>

      <main id="conteudo" class="content" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="js/app.js?v=1.5"></script>
</body>
</html>
